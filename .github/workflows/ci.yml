name: ci

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.2
  DOTNET_NOLOGO: 1

jobs:
  sim-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test sim.tests --configuration Release
      - name: Map generator sweep (M3 done-test)
        run: dotnet run -c Release --project tools/mapgen-sweep -- 1000 1 20 10
      - name: AI balance run (M5 done-test, 120 of the 500 matches)
        run: dotnet run -c Release --project tools/balance-runner -- 120 1 240

  godot:
    runs-on: ubuntu-latest
    needs: sim-tests
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:mono-4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono ~/.local/share/godot/export_templates/ || true
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build C# assembly
        run: dotnet build godot/Planetfall.csproj --configuration Debug
      - name: Import project (a headless import can crash on exit; continue regardless)
        run: godot --headless --path godot --import || true
      - name: Headless smoke test
        run: |
          timeout 60 godot --headless --path godot --quit-after 3 2>&1 | tee smoke.txt
          grep -q "Planetfall sim " smoke.txt
      - name: Save/load self-test
        run: |
          PLANETFALL_AUTOSTART=42 PLANETFALL_SELFTEST=1 PLANETFALL_SPEED=40 timeout 120 godot --headless --path godot 2>&1 | tee selftest.txt
          grep -q "selftest save/load OK" selftest.txt
      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --path godot --export-release "Windows Desktop" ../build/windows/Planetfall.exe
          test -f build/windows/Planetfall.exe
      - uses: actions/upload-artifact@v4
        with:
          name: builds
          path: build/
