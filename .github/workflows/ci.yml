name: ci

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.2
  DOTNET_NOLOGO: 1

jobs:
  sim-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test sim.tests --configuration Release

  godot:
    runs-on: ubuntu-latest
    needs: sim-tests
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:mono-4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Setup export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono ~/.local/share/godot/export_templates/ || true
      - name: Import project (a headless import can crash on exit; continue regardless)
        run: godot --headless --path godot --import || true
      - name: Headless smoke test
        run: |
          timeout 60 godot --headless --path godot --quit-after 3 | tee smoke.txt
          grep -q "Planetfall sim " smoke.txt
      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --path godot --export-release "Windows Desktop" ../build/windows/Planetfall.exe
          test -f build/windows/Planetfall.exe
      - name: Export macOS (universal, unsigned)
        run: |
          mkdir -p build/macos
          godot --headless --path godot --export-release "macOS" ../build/macos/Planetfall.zip
          test -f build/macos/Planetfall.zip
      - uses: actions/upload-artifact@v4
        with:
          name: builds
          path: build/
